<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --btn-bgcolor: rgb(15, 15, 15);
      }

      @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }

      body {
        background-color: black;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      button {
        all: unset;
        position: relative;
        cursor: pointer;
        padding: 14px 52px;
        font-size: 40px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: white;
        overflow: hidden;
        border-radius: 100px;
        border: 4px solid transparent;
        background:
          conic-gradient(from var(--angle) at 50% 50%, black) padding-box,
          conic-gradient(from var(--angle) at 50% 50%, transparent 33%, darkviolet 50%, transparent 66%) border-box;
        box-shadow: 0px 0px 25px rgba(148, 0, 211, 0.574);

        transition: color 0.5s ease;
        animation: rotate-angle 2s linear infinite;

        --after-top: 0px;
        --after-left: 0px;
      }

      button::after {
        content: '';
        position: absolute;
        background-color: rgba(148, 0, 211, 0.9);
        width: 40px;
        height: 40px;
        filter: blur(20px);
        top: calc(var(--after-top) - 20px);
        left: calc(var(--after-left) - 20px);
        transition: opacity 0.2s;

        opacity: 0;
        z-index: 10;
      }
      button:hover {
        color: darkviolet;
        &::after {
          opacity: 1;
        }
      }

      @keyframes rotate-angle {
        from {
          --angle: 0deg;
        }
        to {
          --angle: 360deg;
        }
      }
    </style>
  </head>
  <body>
    <button id="btn">button</button>
  </body>
  <script>
    const btn = document.getElementById('btn');
    btn.addEventListener('mousemove', (e) => {
      btn.style.setProperty('--after-top', e.offsetY + 'px');
      btn.style.setProperty('--after-left', e.offsetX + 'px');
    });
  </script>
</html>
