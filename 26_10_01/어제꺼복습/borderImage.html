<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: black;
        padding: 100px;
      }
      .box {
        margin: auto;
        width: 200px;
        height: 200px;
        border: 4px solid white;
        border-image: linear-gradient(60deg, cyan, #00ff55) 1;
      }
      .box2 {
        margin: auto;
        margin-top: 100px;
        width: 200px;
        height: 200px;
        background:
          linear-gradient(black, black) padding-box,
          linear-gradient(60deg, cyan, yellow, red) border-box;
        background-size: 200%;
        border: 4px solid transparent;

        animation: bg-move 3s infinite alternate;
      }
      @keyframes bg-move {
        0% {
          background-position: 0% 0%;
        }
        100% {
          background-position: 100% 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box2"></div>
  </body>
</html>
