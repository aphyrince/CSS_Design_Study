<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }

      body {
        background: black;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      button {
        all: unset;
        position: relative;
        cursor: pointer;
        padding: 14px 52px;
        font-size: 40px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: white;
        /* overflow: hidden; */
        border-radius: 100px;
        border: 4px solid transparent;
        background:
          conic-gradient(from var(--angle) at 50% 50%, black) padding-box,
          conic-gradient(from var(--angle) at 50% 50%, transparent 40%, rgba(148, 0, 211, 0.76) 50%, transparent 60%)
            border-box;
        /* box-shadow: calc(cos(var(--angle)) * 10px) calc(sin(var(--angle)) * 10px) 50px rgba(148, 0, 211, 0.297); */
        transition: color 0.5s ease;
        animation: rotate-angle 2s linear infinite;

        &::after {
          --size: 80px;
          content: '';
          position: absolute;
          top: calc(50% - var(--size) / 2);
          left: calc(50% - var(--size) / 2);
          z-index: -10;
          width: var(--size);
          height: var(--size);
          border-radius: 50%;
          background: radial-gradient(circle at center, rgba(148, 0, 211, 0.69), transparent 80%);
          filter: blur(20px);
          transform: translateX(calc(sin(var(--angle)) * -120px)) translateY(calc(cos(var(--angle)) * 40px));
          animation: rotate-angle 2s linear infinite;
        }

        &:hover {
          color: darkviolet;
        }
      }

      @keyframes rotate-angle {
        from {
          --angle: 0deg;
        }
        to {
          --angle: 360deg;
        }
      }
    </style>
  </head>
  <body>
    <button id="btn">button</button>
  </body>
</html>
