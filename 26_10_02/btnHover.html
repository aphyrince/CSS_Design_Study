<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Gowun+Batang&family=Gowun+Dodum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

      body {
        font-family: 'Roboto';
        background-color: hsl(240, 4%, 7%);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      :root {
        --primary: 250 66% 61%;
      }

      .btn {
        all: unset;
        font-size: 24px;
        margin-top: 100px;
        padding: 14px 52px;
        background: hsl(0, 0%, 0%);
        color: white;
        text-transform: uppercase;
        position: relative;
        border-radius: 100px;
        cursor: pointer;
      }

      .btn > span {
        font-family: 'Roboto';
        letter-spacing: 1px;
        z-index: 1;
        transition: 0.25s ease;
      }

      .btn:hover > span {
        color: hsl(var(--primary) / 1);
        z-index: 100;
      }

      @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }

      .btn::before,
      .btn::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        background-color: inherit;
        background: conic-gradient(
            from var(--angle) at 50% 50%,
            transparent 0%,
            transparent 33%,
            hsl(var(--primary)) 50%,
            transparent 67%,
            transparent 100%
          )
          border-box;

        z-index: 50;
      }
    </style>
  </head>
  <body>
    <button class="btn">
      <span>Button</span>
    </button>
  </body>
</html>
